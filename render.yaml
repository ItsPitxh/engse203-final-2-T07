# render.yaml — Render Blueprint ของทีม T07
# โปรเจกต์อยู่ที่ root ของ repo แล้ว · ไม่ต้องตั้ง rootDir
services:
  - type: web
    name: engse203-final-2-t07
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Render สุ่ม JWT_SECRET ใหม่ให้ · ไม่อยู่ใน git
      - key: JWT_SECRET
        generateValue: true
      # บัญชีเจ้าหน้าที่ production (ROLES D3) · Render ถามค่าตอนสร้าง · ไม่ commit ค่าจริง
      - key: STAFF_EMAIL
        sync: false
      - key: STAFF_PASSWORD
        sync: false
